name = "terminimal"
description = "A simple, minimal retro theme"
license = "MIT"
homepage = "https://github.com/7a6163/zola-theme-terminimal"
min_version = "0.11.0"

[author]
name = "Zac"
homepage = "https://github.com/7a6163"

# Immediate upstream this fork is based on.
[upstream]
author = "Paweł Romanowski"
homepage = "https://github.com/pawroman"
repo = "https://github.com/pawroman/zola-theme-terminimal"

# The original theme upstream itself was forked from.
[original]
author =  "Radosław Kozieł"
homepage = "https://radoslawkoziel.pl/"
repo = "https://github.com/panr/hugo-theme-terminal"

[extra]

# One of: blue, green, orange, pink, red.
# Defaults to blue.
# Append -light for light themes, e.g. blue-light
# Or append -auto, e.g. blue-auto
accent_color = "blue"

# One of: blue, dark, green, orange, pink, red, light, auto
# Enabling dark background will also modify primary font color to be darker.
# Defaults to accent color (or, if not accent color specified, to blue).
background_color = "blue"

# The logo text - defaults to 2 non-breaking spaces.
logo_text = "Terminimal theme"

# Whether to show links to earlier and later posts
# on each post page.
enable_post_view_navigation = true

# The text shown at the bottom of a post,
# before earlier/later post links.
post_view_navigation_prompt = "Thanks for reading! Read other posts?"

# Use full Hack character set, not just a subset.
# Switch this to true if you need full unicode support.
# Defaults to false.
use_full_hack_font = false

# Optional: author homepage/URL. Used in JSON-LD structured
# data as the `author.url` for BlogPosting and WebSite.
#author_url = "https://example.com"

# Optional: OpenGraph locale override. Defaults to `config.default_language`
# with dashes replaced by underscores (e.g. "zh-TW" -> "zh_TW"). Set this
# when Zola's default_language lacks a region and OG needs one (e.g. "en"
# -> should be "en_US").
#og_locale = "en_US"
